name: Build APK
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.0'
      - name: Fix project
        run: |
          mv lib/main.dart /tmp/main.dart
          rm -rf android ios web linux macos windows test
          flutter create. --platforms=android --project-name happy_voice --overwrite
          mv /tmp/main.dart lib/main.dart
          printf "name: happy_voice\ndescription: Happy Voice App\npublish_to: 'none'\nversion: 1.0.0+1\nenvironment:\n sdk: '>=3.0.0 <4.0.0'\ndependencies:\n flutter:\n sdk: flutter\n agora_rtc_engine: ^6.3.2\n permission_handler: ^11.3.1\nflutter:\n uses-material-design: true\n" > pubspec.yaml
          flutter pub get
      - run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: Happy-Voice-APK
          path: build/app/outputs/flutter-apk/app-release.apk
